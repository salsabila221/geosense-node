[platformio]
default_envs = node_config

[env:blackpill_f411ce]
platform = ststm32
board = blackpill_f411ce
framework = arduino

monitor_speed = 115200
upload_protocol = stlink
debug_tool = stlink

build_flags =
  -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
  -D USBCON
  -std=gnu++17

lib_deps =
  adafruit/Adafruit SSD1306@^2.5.15
  adafruit/Adafruit SH110X@^2.1.12
  adafruit/Adafruit GFX Library@^1.12.1
  xreef/EByte LoRa E220 library@^1.0.8
  arduino-libraries/SD@^1.3.0

lib_ldf_mode = deep+

[env:node_config]
extends = env:blackpill_f411ce
; Node ID, node index, and default OLED type are selected in include/config.h.

[env:node_big_oled]
extends = env:blackpill_f411ce
build_flags =
  ${env:blackpill_f411ce.build_flags}
  -D GEOSENSE_OLED_DRIVER=GEOSENSE_OLED_SSD1306

[env:node_small_oled]
extends = env:blackpill_f411ce
build_flags =
  ${env:blackpill_f411ce.build_flags}
  -D GEOSENSE_OLED_DRIVER=GEOSENSE_OLED_SH1106
